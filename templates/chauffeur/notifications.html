{% extends 'chauffeur/base.html' %}
{% block main_content %}
<div class="p-4 md:p-6 bg-gray-50 flex-1 overflow-y-auto">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fas fa-bell text-blue-500"></i> Notifications
        </h1>

        <div class="space-y-4">
            {% for n in notifications %}
            <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 {% if forloop.first %}border-blue-500{% else %}border-gray-300{% endif %} flex gap-4">
                <div class="pt-1">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">
                        <i class="fas {% if 'Zone' in n.titre %}fa-map-marked-alt{% elif 'CO2' in n.titre %}fa-leaf text-green-500{% else %}fa-info{% endif %}"></i>
                    </div>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-start mb-1">
                        <h4 class="font-bold text-gray-800">{{ n.titre }}</h4>
                        <span class="text-xs text-gray-500">{{ n.date|timesince }}</span>
                    </div>
                    <p class="text-sm text-gray-600">{{ n.message }}</p>
                </div>
            </div>
            {% empty %}
            <div class="bg-white rounded-lg shadow-sm p-8 text-center text-gray-500">
                <i class="fas fa-bell-slash text-4xl mb-3 opacity-20"></i>
                <p>Aucune notification pour le moment.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
