{% extends 'admin_panel/base.html' %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Ajouter une Zone</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow p-6">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Nom de la Zone</label>
                    <input type="text" name="nom" required class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Ville</label>
                    <input type="text" name="ville" required class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Latitude</label>
                        <input type="text" name="lat" id="lat" readonly required class="shadow border rounded w-full py-2 px-3 bg-gray-100 text-gray-700">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Longitude</label>
                        <input type="text" name="lng" id="lng" readonly required class="shadow border rounded w-full py-2 px-3 bg-gray-100 text-gray-700">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Rayon (km)</label>
                    <input type="number" name="rayon" id="rayon" value="15" step="0.5" required class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">Couleur sur la carte</label>
                    <input type="color" name="couleur" value="#3B82F6" class="h-10 w-full p-1 cursor-pointer">
                </div>

                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                        Créer la zone
                    </button>
                    <a href="{% url 'admin_panel:zones' %}" class="text-gray-600 hover:text-gray-900">Annuler</a>
                </div>
            </form>
        </div>
        
        <div class="bg-white rounded-lg shadow p-4 h-96">
            <p class="text-sm text-gray-500 mb-2">Cliquez sur la carte pour définir le centre de la zone.</p>
            <div id="map" class="h-full w-full rounded"></div>
        </div>
    </div>
</div>

<script>
    var map = L.map('map').setView([33.5731, -7.5898], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var currentMarker = null;
    var currentCircle = null;

    map.on('click', function(e) {
        document.getElementById('lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('lng').value = e.latlng.lng.toFixed(6);
        
        if (currentMarker) {
            map.removeLayer(currentMarker);
            map.removeLayer(currentCircle);
        }
        
        var rayon = document.getElementById('rayon').value;
        
        currentMarker = L.marker(e.latlng).addTo(map);
        currentCircle = L.circle(e.latlng, {
            color: 'blue',
            fillColor: 'blue',
            fillOpacity: 0.3,
            radius: rayon * 1000
        }).addTo(map);
    });

    document.getElementById('rayon').addEventListener('input', function(e) {
        if (currentCircle) {
            currentCircle.setRadius(e.target.value * 1000);
        }
    });
</script>
{% endblock %}
