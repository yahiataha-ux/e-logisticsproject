{% extends 'admin_panel/base.html' %}

{% block title %}Atlas | Modifier Utilisateur{% endblock %}
{% block header_title %}Modifier le Profil{% endblock %}
{% block breadcrumb %}Utilisateurs / Modifier{% endblock %}

{% block content %}
<div class="p-10 max-w-2xl mx-auto">
    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8">
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Nom d'utilisateur</label>
                    <input type="text" name="username" value="{{ user_to_edit.username }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Email</label>
                    <input type="email" name="email" value="{{ user_to_edit.email }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Rôle</label>
                    <select name="role" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                        <option value="Admin" {% if user_to_edit.role == 'Admin' %}selected{% endif %}>Admin</option>
                        <option value="Entreprise" {% if user_to_edit.role == 'Entreprise' %}selected{% endif %}>Entreprise</option>
                        <option value="Transporteur" {% if user_to_edit.role == 'Transporteur' %}selected{% endif %}>Transporteur</option>
                        <option value="Client" {% if user_to_edit.role == 'Client' %}selected{% endif %}>Client</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Compagnie</label>
                    <input type="text" name="company_name" value="{{ user_to_edit.company_name|default:'' }}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div class="pt-4 flex space-x-3">
                    <button type="submit" class="flex-1 bg-premium-900 text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-black transition-all shadow-lg">Enregistrer</button>
                    <a href="{% url 'admin_panel:users' %}" class="flex-1 bg-white border border-slate-200 text-slate-700 px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-slate-50 transition-all text-center">Annuler</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
