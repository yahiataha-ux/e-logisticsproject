{% extends 'admin_panel/base.html' %}

{% block title %}Atlas | Nouvel Utilisateur{% endblock %}
{% block header_title %}Créer un nouveau profil{% endblock %}
{% block breadcrumb %}Utilisateurs / Nouveau{% endblock %}

{% block content %}
<div class="p-10 max-w-2xl mx-auto">
    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8">
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Nom d'utilisateur</label>
                    <input type="text" name="username" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Email</label>
                    <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Mot de passe (par défaut: 123)</label>
                    <input type="password" name="password" value="123" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Rôle</label>
                    <select name="role" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                        {% for role in roles %}
                        <option value="{{ role }}">{{ role }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Compagnie / Organisation</label>
                    <input type="text" name="company_name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-premium-500 transition-all">
                </div>
                <div class="pt-4 flex space-x-3">
                    <button type="submit" class="flex-1 bg-premium-900 text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-black transition-all shadow-lg">Créer l'utilisateur</button>
                    <a href="{% url 'admin_panel:users' %}" class="flex-1 bg-white border border-slate-200 text-slate-700 px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-slate-50 transition-all text-center">Annuler</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
